name: Bootstrap Icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract icons
        run: |
          tar xzf *-icons.tar.gz
          rm *-icons.tar.gz
      - name: Commit icons
        run: |
          git config user.name "Muse"
          git config user.email "muse@wajiha.fun"
          git add ios/Runner/Assets.xcassets/AppIcon.appiconset/
          git rm -q *-icons.tar.gz || echo "tarball already gone"
          git commit -m "Add professional app icons" || echo "nothing to commit"
          git rm -q .github/workflows/bootstrap.yml
          git commit -m "Remove bootstrap" || echo "nothing to remove"
          git push
