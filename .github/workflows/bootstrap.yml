name: Bootstrap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          tar xzf sizetwin.tar.gz
          rm sizetwin.tar.gz
          rm -rf .github/workflows
      - name: Commit project files
        run: |
          git config user.name "Muse"
          git config user.email "muse@wajiha.fun"
          git add -A
          git commit -m "Add SizeTwin project files" || echo "nothing to commit"
          git push
